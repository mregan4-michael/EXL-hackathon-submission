name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.10"
      - run: uv sync --frozen
      - run: uv run ruff check factory
      - run: uv run black --check factory
  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.10"
      - run: uv sync --frozen
      - run: uv run mypy
  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.10"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: uv sync --frozen
      - run: uv run pytest --cov=factory --cov-report=term
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.10"
      - run: uv sync --frozen
      - run: uv export --frozen --no-hashes --no-emit-project > /tmp/req.txt && uv run pip-audit --disable-pip --no-deps -r /tmp/req.txt
  target:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.10"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --frozen
      - name: regenerate and fail on drift from the committed target
        run: |
          uv run factory parse claims-workbench approvals-kit
          uv run factory generate claims-workbench approvals-kit
          git diff --exit-code generated
      - run: dotnet test generated/claims-workbench/src/Tests/Factory.Tests.csproj
      - name: differential parity vs the Power Fx oracle (frozen test set; fail on mismatch or drift)
        run: |
          uv run factory parity --all --check
          git diff --exit-code parity/reports parity/testset
      - run: dotnet build generated/approvals-kit/src/Api/Factory.Api.csproj
      - run: cd generated/claims-workbench/web && npm ci && npx tsc --noEmit && npm run build
      - run: az bicep build --file generated/claims-workbench/infra/main.bicep --stdout > /dev/null
      - name: core journey through docker compose
        run: |
          cd generated/claims-workbench && docker compose up -d --build
          for _ in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 1; done
          cd ../.. && python3 scripts/journey.py --record parity/scenarios/claims-workbench.json && git diff --exit-code parity/scenarios
