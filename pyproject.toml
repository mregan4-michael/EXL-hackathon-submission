[project]
name = "migration-factory"
version = "0.1.0"
description = "Agentic Power Platform -> React/.NET/Cosmos migration factory"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "jsonschema==4.23.0",
  "pyyaml==6.0.2",
  "pydantic==2.10.6",
  "httpx==0.28.1",
  "jinja2==3.1.6",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "mypy==1.15.0",
  "ruff==0.11.2",
  "black==26.10.1",
  "types-pyyaml==6.0.12.20250326",
  "types-jsonschema==4.23.0.20241208",
  "pip-audit==2.8.0",
  "pre-commit==4.2.0",
]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory/src/factory"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["factory/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"factory/tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "factory/src"
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["factory/tests"]
pythonpath = ["factory/src"]
addopts = "-q"
